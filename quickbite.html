      </div>

      <!-- Navigation & Action Buttons -->
      <div class="flex items-center gap-2 sm:gap-4">

        <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-xs font-semibold">

        </button>

        <button onclick="navigateTo('cart')" class="relative p-2 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600">

          <span id="cart-badge" class="absolute -top-1 -right-1 bg-brand-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
        </button>

        <div id="user-nav-container">
          <button onclick="navigateTo('login')" class="bg-brand-600 hover:bg-brand-700 text-white text-xs sm:text-sm font-semibold px-3 py-2 rounded-lg transition">
            Login
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Sub-Header Navigation Links (Hidden when Admin is logged in and viewing admin panel) -->
  <nav id="sub-nav-bar" class="bg-slate-100 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-700 text-xs sm:text-sm overflow-x-auto">
    <div class="max-w-7xl mx-auto px-4 flex gap-4 sm:gap-8 whitespace-nowrap">
      <button onclick="navigateTo('home')" class="py-3 font-medium hover:text-brand-600 dark:hover:text-brand-500 border-b-2 border-transparent hover:border-brand-600 transition">Home / Menu</button>
      <button onclick="navigateTo('favorites')" class="py-3 font-medium hover:text-brand-600 dark:hover:text-brand-500 border-b-2 border-transparent hover:border-brand-600 transition">Favorites</button>
      <button onclick="navigateTo('orders')" class="py-3 font-medium hover:text-brand-600 dark:hover:text-brand-500 border-b-2 border-transparent hover:border-brand-600 transition">Order History</button>
      <button onclick="navigateTo('delivery')" class="py-3 font-medium hover:text-brand-600 dark:hover:text-brand-500 border-b-2 border-transparent hover:border-brand-600 transition">Delivery Status</button>

    </div>
  </nav>

  <!-- Main Content Container -->
  <main id="app-content" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Pages render dynamically -->
  </main>

        <i class="fa-solid fa-clock text-brand-500"></i> Open Daily: 07:00 AM - 10:00 PM
      </p>
    </div>
  </footer>

  <!-- Javascript Application Logic -->

      { id: '8', category: 'food', name: 'Mkate wa Ufuta', nameSw: 'Mkate wa Ufuta', price: 2000, cost: 900, rating: 4.7, img: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=400&q=80', desc: 'Sesame seed flatbread.' },
      { id: '9', category: 'food', name: 'Mkate wa Chila', nameSw: 'Mkate wa Chila', price: 1000, cost: 400, rating: 4.6, img: 'https://images.unsplash.com/photo-1589301760014-d929f3979dbc?auto=format&fit=crop&w=400&q=80', desc: 'Rice flour sweet pancake.' },
      { id: '10', category: 'food', name: 'Urojo / Mix', nameSw: 'Urojo / Mix', price: 3000, cost: 1500, rating: 5.0, img: 'https://images.unsplash.com/photo-1546833999-b9f581a1996d?auto=format&fit=crop&w=400&q=80', desc: 'Famous Zanzibar tangy mango soup.' },
      { id: '11', category: 'food', name: 'Buns', nameSw: 'Bansi', price: 500, cost: 200, rating: 4.4, img: 'https://images.unsplash.com/photo-1586444248902-2f64eddc13df?auto=format&fit=crop&w=400&q=80', desc: 'Fresh baked soft buns.' },
      { id: '12', category: 'food', name: 'Cakes', nameSw: 'Keki', price: 2500, cost: 1100, rating: 4.6, img: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=400&q=80', desc: 'Homemade slice of cake.' },
      { id: '13', category: 'food', name: 'Cookies (Vileja)', nameSw: 'Vileja', price: 1500, cost: 600, rating: 4.8, img: 'https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=400&q=80', desc: 'Melt-in-mouth butter cookies.' },
      { id: '14', category: 'drink', name: 'Water', nameSw: 'Maji ya Chupa', price: 1000, cost: 500, rating: 4.9, img: 'https://images.unsplash.com/photo-1548839140-29a749e1bc4e?auto=format&fit=crop&w=400&q=80', desc: 'Mineral drinking water (500ml).' },
      { id: '15', category: 'drink', name: 'Mango Fresh Juice', nameSw: 'Juisi ya Embe', price: 2000, cost: 800, rating: 4.9, img: 'https://images.unsplash.com/photo-1546173159-315724a31696?auto=format&fit=crop&w=400&q=80', desc: 'Cold fresh local mango juice.' },
      { id: '16', category: 'drink', name: 'Passion Fresh Juice', nameSw: 'Juisi ya Passion', price: 2000, cost: 800, rating: 4.8, img: 'https://images.unsplash.com/photo-1534353473418-4cfa6c56fd38?auto=format&fit=crop&w=400&q=80', desc: 'Fresh passion fruit juice.' },
      { id: '17', category: 'drink', name: 'Avocado Fresh Juice', nameSw: 'Juisi ya Parachichi', price: 2500, cost: 1000, rating: 4.7, img: 'https://images.unsplash.com/photo-1525385133512-2f3bdd039054?auto=format&fit=crop&w=400&q=80', desc: 'Thick avocado smoothie.' },
      { id: '18', category: 'drink', name: 'Pineapple Fresh Juice', nameSw: 'Juisi ya Nanasi', price: 2000, cost: 800, rating: 4.8, img: 'https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=400&q=80', desc: 'Sweet pineapple juice.' },
      { id: '19', category: 'drink', name: 'Karkadee Fresh Juice', nameSw: 'Juisi ya Karkadee', price: 1500, cost: 600, rating: 4.9, img: 'https://images.unsplash.com/photo-1556881286-fc6915169721?auto=format&fit=crop&w=400&q=80', desc: 'Spiced hibiscus iced tea juice.' },
      { id: '20', category: 'drink', name: 'Ukwaju Juice', nameSw: 'Juisi ya Ukwaju', price: 1500, cost: 600, rating: 5.0, img: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=400&q=80', desc: 'Sweet & sour tamarind juice.' },
      { id: '21', category: 'drink', name: 'Mix Fruits Juice', nameSw: 'Juisi ya Matunda Mchanganyiko', price: 3000, cost: 1200, rating: 4.8, img: 'https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=400&q=80', desc: 'Mixed tropical fruit juice.' }
    ];

    let state = {
      lang: 'en',
      darkMode: false,
      user: null,
      tempUser: null,
      appliedPromo: null,
      favorites: [],
      cart: [],
      adminTab: 'orders',
      financialUnlocked: false,
      finPassword: 'Sa22126453@',
      financialFilter: 'daily',
      orders: JSON.parse(localStorage.getItem('qb_orders')) || [],
      expenses: JSON.parse(localStorage.getItem('qb_expenses')) || [],
      registeredUsers: JSON.parse(localStorage.getItem('qb_users')) || [],
      menu: JSON.parse(localStorage.getItem('qb_menu')) || defaultMenu
    };

    function saveStateToLocalStorage() {
      localStorage.setItem('qb_menu', JSON.stringify(state.menu));
      localStorage.setItem('qb_orders', JSON.stringify(state.orders));
      localStorage.setItem('qb_expenses', JSON.stringify(state.expenses));
      localStorage.setItem('qb_users', JSON.stringify(state.registeredUsers));
    }

    const i18n = {
      en: {
        login: 'Login',
        hero_title: 'Fast & Fresh Take Away Food in Kisauni!',
        hero_sub: 'Authentic Zanzibar snacks, bites, and fresh tropical juices delivered right to your door in Kisauni.',
        all: 'All Items',
        foods: 'Snacks & Food',
        drinks: 'Fresh Juices & Drinks',
        add_to_cart: 'Add to Cart',
        total: 'Total',
        pay_method: 'Select Payment Method',
        cash: 'Cash on Delivery',
        mPesa: 'M-Pesa / TigoPesa / Airtel Money',
        place_order: 'Confirm & Place Order',
      },
      sw: {
        login: 'Ingia',
        hero_title: 'Chakula Cha Haraka na Kibichi Kisauni!',
        hero_sub: 'Vyakula, vitafunwa vya Kizanzibari na juisi za matunda halisi vinaletwa ulipo Kisauni.',
        all: 'Vyote',
        foods: 'Vitafunwa & Vyakula',
        drinks: 'Juisi & Vinywaji',
        add_to_cart: 'Weka Tenga',
        total: 'Jumla',
        pay_method: 'Chagua Njia ya Malipo',
        cash: 'Lipa Ukipokea (Pesa Taslimu)',
        mPesa: 'Lipa kwa TigoPesa / M-Pesa / Airtel',
        place_order: 'Thibitisha Oda',
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('qb_dark') === 'true') toggleDarkMode(true);
      renderPage('home');
    });

    function navigateTo(page, params = {}) {
      renderPage(page, params);
      window.scrollTo(0,0);
    }

    function renderPage(page, params = {}) {
      const container = document.getElementById('app-content');
      const subNavBar = document.getElementById('sub-nav-bar');

      if (state.user && state.user.isAdmin && page === 'admin') {
        subNavBar.classList.add('hidden');
      } else {
        subNavBar.classList.remove('hidden');
      }
      
      switch(page) {
        case 'home': container.innerHTML = getHomePageHTML(); break;
        case 'cart': container.innerHTML = getCartPageHTML(); break;
        case 'orders': container.innerHTML = getOrdersPageHTML(); break;
        case 'delivery': container.innerHTML = getDeliveryPageHTML(); break;
        case 'favorites': container.innerHTML = getFavoritesPageHTML(); break;
        case 'login': container.innerHTML = getLoginPageHTML('signin'); break;
        case 'register': container.innerHTML = getLoginPageHTML('register'); break;
        case 'verify-phone': container.innerHTML = getVerifyPhonePageHTML(params.contact || ''); break;
        case 'admin':
          if (!state.user || !state.user.isAdmin) {
            toast('Admin access required! Please login with admin credentials.', 'bg-red-500');
            navigateTo('login');
            return;
          }
          container.innerHTML = getAdminPageHTML();
          break;
        default: container.innerHTML = `<h2 class="text-xl">Page Not Found</h2>`;
      }
      
      updateCartBadge();
      updateUserNav();
    }

    function getHomePageHTML() {
      const t = i18n[state.lang];
      return `
        <!-- Hero Section -->
        <div class="bg-gradient-to-r from-brand-600 to-orange-500 rounded-2xl p-6 sm:p-10 text-white shadow-xl mb-6 flex flex-col md:flex-row items-center justify-between gap-6">
          <div class="space-y-4 max-w-xl text-center md:text-left">
            <span class="bg-white/20 text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider">Kisauni - Zanzibar</span>
            <h2 class="text-2xl sm:text-4xl font-extrabold leading-tight">${t.hero_title}</h2>
            <p class="text-white/90 text-sm sm:text-base">${t.hero_sub}</p>
          </div>
          <div class="w-28 h-28 sm:w-36 sm:h-36 bg-slate-950/80 p-3 rounded-full shadow-2xl flex items-center justify-center border-4 border-white/20">
             <svg class="w-full h-full text-brand-500" viewBox="0 0 100 100" fill="currentColor">
                <path d="M50 15 C45 35, 30 40, 30 60 C30 75, 40 85, 50 85 C60 85, 70 75, 70 60 C70 40, 55 35, 50 15 Z" fill="url(#flameGrad2)" />
                <path d="M20 55 C20 75, 35 90, 50 90 C65 90, 80 75, 80 55 C70 65, 60 70, 50 70 C40 70, 30 65, 20 55 Z" fill="#ea580c" />
                <defs>
                  <linearGradient id="flameGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffb703" />
                    <stop offset="100%" stop-color="#fb8500" />
                  </linearGradient>
                </defs>
             </svg>
          </div>
        </div>

        <!-- Promo Banner -->
        <div class="bg-amber-100 dark:bg-amber-950/50 border border-amber-300 dark:border-amber-800 rounded-xl p-3 mb-6 flex items-center justify-between text-xs text-amber-900 dark:text-amber-200">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-tags text-brand-500 text-base"></i>
            <span>Use Promo Code <strong class="bg-amber-200 dark:bg-amber-900 px-2 py-0.5 rounded text-brand-600 font-extrabold">KISAUNI10</strong> for 10% OFF your order!</span>
          </div>
        </div>

        <!-- Filter & Search -->
        <div class="flex flex-col sm:flex-row gap-4 justify-between items-center mb-6">
          <div class="flex gap-2 bg-slate-200 dark:bg-slate-800 p-1 rounded-xl w-full sm:w-auto">
            <button onclick="filterMenu('all')" id="filter-all" class="flex-1 sm:flex-none px-4 py-2 text-xs sm:text-sm font-semibold rounded-lg bg-white dark:bg-slate-700 shadow-sm">${t.all}</button>
            <button onclick="filterMenu('food')" id="filter-food" class="flex-1 sm:flex-none px-4 py-2 text-xs sm:text-sm font-semibold rounded-lg text-slate-600 dark:text-slate-300">${t.foods}</button>
            <button onclick="filterMenu('drink')" id="filter-drink" class="flex-1 sm:flex-none px-4 py-2 text-xs sm:text-sm font-semibold rounded-lg text-slate-600 dark:text-slate-300">${t.drinks}</button>
          </div>

          <div class="relative w-full sm:w-64">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" onkeyup="searchMenu(this.value)" placeholder="Search food/drinks..." class="w-full pl-9 pr-4 py-2 text-xs sm:text-sm rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500">
          </div>
        </div>

        <!-- Menu Grid -->
        <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          ${renderMenuItems(state.menu)}
        </div>
      `;
    }

    function renderMenuItems(items) {
      if (items.length === 0) return `<p class="col-span-full text-center text-slate-500 py-10">No items found.</p>`;
      
      return items.map(item => {
        const isFav = state.favorites.includes(item.id);
        const name = state.lang === 'sw' ? item.nameSw : item.name;
        return `
          <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/60 overflow-hidden hover:shadow-md transition flex flex-col justify-between">
            <div class="relative h-44 overflow-hidden">
              <img src="${item.img}" alt="${name}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
              <button onclick="toggleFavorite('${item.id}')" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/80 dark:bg-slate-900/80 backdrop-blur flex items-center justify-center text-slate-700 dark:text-slate-200 hover:text-red-500 transition">
                <i class="${isFav ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart"></i>
              </button>
              <div class="absolute bottom-2 left-2 bg-slate-950/70 text-white text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1 backdrop-blur">
                <i class="fa-solid fa-star text-amber-400"></i> ${item.rating || 4.8}
              </div>
            </div>
            <div class="p-4 flex-grow flex flex-col justify-between space-y-3">
              <div>
                <h3 class="font-bold text-base text-slate-900 dark:text-white">${name}</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">${item.desc}</p>
              </div>
              
              <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-slate-700">
                <span class="text-sm font-black text-brand-600 dark:text-brand-500">${item.price.toLocaleString()} TZS</span>
                <button onclick="addToCart('${item.id}')" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold px-3 py-2 rounded-xl flex items-center gap-1 transition shadow-sm active:scale-95">
                  <i class="fa-solid fa-plus"></i> ${i18n[state.lang].add_to_cart}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function getLoginPageHTML(mode = 'signin') {
      const isSignIn = mode === 'signin';
      return `

    function togglePasswordVisibility(fieldId, btn) {
      const input = document.getElementById(fieldId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    function openForgotPasswordModal() {
      const modal = document.getElementById('modal-overlay');
      const container = document.getElementById('modal-container');

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-center border-b pb-2">
            <h3 class="font-bold text-base text-brand-600"><i class="fa-solid fa-key"></i> Password Recovery</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
          </div>
          <p class="text-xs text-slate-500">Enter your registered email or phone number below. We will send you a secure OTP reset link.</p>
          <form onsubmit="handlePasswordReset(event)" class="space-y-3">
            <input type="text" id="reset-contact" required placeholder="e.g. 0770000000 or email@domain.com" class="w-full text-xs p-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-700">Cancel</button>

        </div>

      modal.classList.remove('hidden');

    function handlePasswordReset(e) {

    function confirmCustomerReceived(orderId) {

        toast('Delivery confirmed as Received! Admin & WhatsApp notified.', 'bg-emerald-600');
        renderPage('delivery');
        sendOrderToWhatsApp(order.id, true);
      }
    }

                      `*Location:* ${order.location}%0A` +

    function calculateFinancialMetrics(filterType) {
      const periods = {};

      state.orders.forEach(order => {
        let periodKey = order.date.split(' ')[0];
        if (filterType === 'monthly') {
          periodKey = periodKey.substring(0, 7);
        }

        if (!periods[periodKey]) {
          periods[periodKey] = { period: periodKey, ordersCount: 0, revenue: 0, cogs: 0, expenses: 0 };
        }

        periods[periodKey].ordersCount += 1;
        periods[periodKey].revenue += order.total;

        let orderCogs = 0;
        order.items.forEach(item => {
          const menuItem = state.menu.find(m => m.name === item.name || m.nameSw === item.name);
          const unitCost = menuItem && menuItem.cost ? menuItem.cost : (item.price * 0.45);
          orderCogs += (unitCost * item.qty);
        });
        periods[periodKey].cogs += orderCogs;
      });

      state.expenses.forEach(exp => {
        let periodKey = exp.date;
        if (filterType === 'monthly') {
          periodKey = periodKey.substring(0, 7);
        }

        if (!periods[periodKey]) {
          periods[periodKey] = { period: periodKey, ordersCount: 0, revenue: 0, cogs: 0, expenses: 0 };
        }

        periods[periodKey].expenses += exp.amount;
      });

      const rows = [];
      const totals = { revenue: 0, cogs: 0, expenses: 0, profit: 0 };

      Object.keys(periods).sort().reverse().forEach(pKey => {
        const p = periods[pKey];
        const profit = p.revenue - p.cogs - p.expenses;
        const margin = p.revenue > 0 ? (profit / p.revenue) * 100 : 0;

        rows.push({
          period: p.period,
          ordersCount: p.ordersCount,
          revenue: p.revenue,
          cogs: p.cogs,
          expenses: p.expenses,
          profit,
          margin
        });

        totals.revenue += p.revenue;
        totals.cogs += p.cogs;
        totals.expenses += p.expenses;
        totals.profit += profit;
      });

      return { rows, totals };
    }

              <select id="exp-category" class="w-full text-xs p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                <option value="Ingredients">Ingredients Market</option>
                <option value="Gas & Utilities">Gas & Utilities</option>
                <option value="Packaging">Takeaway Packaging</option>
                <option value="Spoilage/Loss">Food Spoilage / Loss</option>
                <option value="Other">Other Operational Cost</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold mb-1">Description</label>
              <input type="text" id="exp-desc" placeholder="e.g. Cooking Gas Refill" required class="w-full text-xs p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
            </div>

            <div>
              <label class="block text-xs font-semibold mb-1">Amount (TZS)</label>
              <input type="number" id="exp-amount" min="100" required placeholder="e.g. 15000" class="w-full text-xs p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
            </div>

            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-700">Cancel</button>
              <button type="submit" class="px-4 py-2 rounded-xl text-xs font-bold bg-red-600 text-white">Save Expense</button>
            </div>
          </form>
        </div>
      `;

      modal.classList.remove('hidden');
    }

    function handleSaveExpense(e) {
      e.preventDefault();
      const date = document.getElementById('exp-date').value;
      const category = document.getElementById('exp-category').value;
      const description = document.getElementById('exp-desc').value;
      const amount = parseInt(document.getElementById('exp-amount').value) || 0;

      state.expenses.push({ id: Date.now().toString(), date, category, description, amount });
      saveStateToLocalStorage();
      renderPage('admin');
      closeModal();
      toast('Expense logged successfully', 'bg-red-600');
    }

    function updateItemCost(id, newCost) {
      const item = state.menu.find(i => i.id === id);
      if (item) {
        item.cost = parseInt(newCost) || 0;
        saveStateToLocalStorage();
        toast(`Cost updated for ${item.name}`, 'bg-purple-600');
      }
    }

    function updateItemPrice(id, newPrice) {
      const item = state.menu.find(i => i.id === id);
      if (item) { 
        item.price = parseInt(newPrice) || 0; 
        saveStateToLocalStorage();
        toast(`Price updated for ${item.name}`, 'bg-purple-600'); 
      }
    }

    function updateOrderStatus(orderId, newStatus) {
      const order = state.orders.find(o => o.id === orderId);
      if (order) {
        order.status = newStatus;
        saveStateToLocalStorage();
        toast(`Order #${orderId} status set to ${newStatus}`, 'bg-purple-600');
        renderPage('admin');
      }
    }

    function updateOrderPaymentStatus(orderId, newPaymentStatus) {
      const order = state.orders.find(o => o.id === orderId);
      if (order) {
        order.paymentStatus = newPaymentStatus;
        saveStateToLocalStorage();
        toast(`Order #${orderId} payment set to ${newPaymentStatus}`, 'bg-purple-600');
        renderPage('admin');
      }
    }

    function deleteMenuItem(id) {
      state.menu = state.menu.filter(i => i.id !== id);
      saveStateToLocalStorage();
      renderPage('admin');
      toast('Item deleted from menu', 'bg-red-500');
    }

    function openChangeImageModal(itemId) {
      const item = state.menu.find(i => i.id === itemId);
      const modal = document.getElementById('modal-overlay');
      const container = document.getElementById('modal-container');

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-center border-b pb-2">
            <h3 class="font-bold text-base">Change Picture for "${item.name}"</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
          </div>

          <div class="space-y-3">
            <div>
              <label class="block text-xs font-semibold mb-1">Option 1: Image Web URL</label>
              <input type="url" id="image-url-input" placeholder="https://..." value="${item.img.startsWith('data:') ? '' : item.img}" class="w-full text-xs p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
            </div>

            <div class="text-center text-xs text-slate-400 font-bold uppercase">— OR —</div>

            <div>
              <label class="block text-xs font-semibold mb-1">Option 2: Upload Image File</label>
              <input type="file" id="image-file-input" accept="image/*" class="w-full text-xs border border-slate-300 dark:border-slate-700 rounded-xl p-2 bg-slate-50 dark:bg-slate-900">
            </div>
          </div>

          <div class="flex justify-end gap-2 pt-2">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-700">Cancel</button>
            <button onclick="saveItemImage('${item.id}')" class="px-4 py-2 rounded-xl text-xs font-bold bg-purple-600 text-white">Save Picture</button>
          </div>
        </div>
      `;

      modal.classList.remove('hidden');
    }

    function saveItemImage(itemId) {
      const item = state.menu.find(i => i.id === itemId);
      const urlInput = document.getElementById('image-url-input').value;
      const fileInput = document.getElementById('image-file-input').files[0];

      if (fileInput) {
        const reader = new FileReader();
        reader.onload = function(e) {
          item.img = e.target.result;
          saveStateToLocalStorage();
          renderPage('admin');
          closeModal();
          toast(`Picture updated for ${item.name}`, 'bg-purple-600');
        };
        reader.readAsDataURL(fileInput);
      } else if (urlInput) {
        item.img = urlInput;
        saveStateToLocalStorage();
        renderPage('admin');
        closeModal();
        toast(`Picture updated for ${item.name}`, 'bg-purple-600');
      } else {
        toast('Please enter a URL or choose an image file', 'bg-red-500');
      }
    }

    function openAddItemModal() {
      const modal = document.getElementById('modal-overlay');
      const container = document.getElementById('modal-container');

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-center border-b pb-2">
            <h3 class="font-bold text-base">Add New Menu Item</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
          </div>

          <form onsubmit="handleAddNewItem(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold mb-1">Item Name (English)</label>
              <input type="text" id="new-name" required class="w-full text-xs p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
            </div>

            <div>
              <label class="block text-xs font-semibold mb-1">Item Name (Swahili)</label>
              <input type="text" id="new-name-sw" required class="w-full text-xs p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
            </div>

            <div class="grid grid-cols-3 gap-2">
              <div>
                <label class="block text-xs font-semibold mb-1">Category</label>
                <select id="new-category" class="w-full text-xs p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                  <option value="food">Snack / Food</option>
                  <option value="drink">Fresh Juice / Drink</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1">Cost Price (TZS)</label>
                <input type="number" id="new-cost" required min="50" value="600" class="w-full text-xs p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1">Sell Price (TZS)</label>
                <input type="number" id="new-price" required min="100" value="1500" class="w-full text-xs p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold mb-1">Picture File or URL</label>
              <input type="file" id="new-file-input" accept="image/*" class="w-full text-xs border border-slate-300 dark:border-slate-700 rounded-xl p-2 bg-slate-50 dark:bg-slate-900 mb-1">
              <input type="url" id="new-url-input" placeholder="Or paste image URL" class="w-full text-xs p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
            </div>

            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-700">Cancel</button>
              <button type="submit" class="px-4 py-2 rounded-xl text-xs font-bold bg-purple-600 text-white">Create Item</button>
            </div>
          </form>
        </div>
      `;

      modal.classList.remove('hidden');
    }

    function handleAddNewItem(e) {
      e.preventDefault();
      const name = document.getElementById('new-name').value;
      const nameSw = document.getElementById('new-name-sw').value;
      const category = document.getElementById('new-category').value;
      const cost = parseInt(document.getElementById('new-cost').value) || 500;
      const price = parseInt(document.getElementById('new-price').value) || 1000;
      const fileInput = document.getElementById('new-file-input').files[0];
      const urlInput = document.getElementById('new-url-input').value;
      let defaultImg = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80';

      const createAndPush = (imgSrc) => {
        state.menu.unshift({
          id: Date.now().toString(),
          category,
          name,
          nameSw,
          cost,
          price,
          rating: 5.0,
          img: imgSrc,
          desc: 'Freshly prepared at Quick Bite Kisauni.'
        });
        saveStateToLocalStorage();
        renderPage('admin');
        closeModal();
        toast(`Added ${name} to menu!`, 'bg-purple-600');
      };

      if (fileInput) {
        const reader = new FileReader();
        reader.onload = (ev) => createAndPush(ev.target.result);
        reader.readAsDataURL(fileInput);
      } else {
        createAndPush(urlInput || defaultImg);
      }
    }

    function viewReceiptModal(orderId) {
      const order = state.orders.find(o => o.id === orderId);
      const container = document.getElementById('modal-container');
      
      container.innerHTML = `
        <div class="space-y-4 text-slate-800 dark:text-slate-100">
          <div class="text-center space-y-1 border-b pb-4">
            <h3 class="font-extrabold text-lg text-brand-600">QUICK BITE TAKE AWAY</h3>
            <p class="text-xs text-slate-500">Kisauni, Zanzibar • +255 673 644 983</p>
            <p class="text-xs font-bold text-slate-700 dark:text-slate-300">Receipt #${order.id}</p>
          </div>

          <div class="text-xs space-y-2">
            <p><strong>Customer:</strong> ${order.customerName || 'Customer'}</p>
            <p><strong>Date:</strong> ${order.date}</p>
            <p><strong>Location:</strong> ${order.location}</p>
            <p><strong>Status:</strong> ${order.status}</p>

            <table class="w-full text-left border-t border-b py-2 my-2">
              <thead>
                <tr class="border-b">
                  <th class="py-1">Item</th>
                  <th class="py-1">Qty</th>
                  <th class="py-1 text-right">Price</th>
                </tr>
              </thead>
              <tbody>
                ${order.items.map(i => `
                  <tr>
                    <td class="py-1">${i.name}</td>
                    <td class="py-1">${i.qty}</td>
                    <td class="py-1 text-right">${(i.qty * i.price).toLocaleString()} TZS</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>

            <div class="space-y-1 text-right font-bold">
              <p>Delivery: ${order.deliveryFee.toLocaleString()} TZS</p>
              <p class="text-sm text-brand-600">Total Paid: ${order.total.toLocaleString()} TZS</p>
            </div>
          </div>

          <div class="flex justify-between gap-2 pt-4 border-t">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-700">Close</button>
            <button onclick="window.print()" class="px-4 py-2 rounded-xl text-xs font-bold bg-brand-600 text-white"><i class="fa-solid fa-print"></i> Print Receipt</button>
          </div>
        </div>
      `;

      document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
    }

    function applyPromo() {
      const code = document.getElementById('promo-input').value.trim().toUpperCase();
      if (code === 'KISAUNI10') {
        state.appliedPromo = 'KISAUNI10';
        toast('10% Promo Discount Applied!', 'bg-green-600');
        renderPage('cart');
      } else {
        toast('Invalid Promo Code', 'bg-red-500');
      }
    }

    function filterMenu(cat) {
      document.querySelectorAll('[id^="filter-"]').forEach(btn => {
        btn.classList.remove('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-slate-900');
        btn.classList.add('text-slate-600', 'dark:text-slate-300');
      });
      document.getElementById(`filter-${cat}`).classList.add('bg-white', 'dark:bg-slate-700', 'shadow-sm');
      const filtered = cat === 'all' ? state.menu : state.menu.filter(i => i.category === cat);
      document.getElementById('menu-grid').innerHTML = renderMenuItems(filtered);
    }

    function searchMenu(query) {
      const q = query.toLowerCase();
      const filtered = state.menu.filter(i => i.name.toLowerCase().includes(q) || i.nameSw.toLowerCase().includes(q));
      document.getElementById('menu-grid').innerHTML = renderMenuItems(filtered);
    }

    function addToCart(id) {
      const item = state.menu.find(i => i.id === id);
      const existing = state.cart.find(c => c.id === id);
      if (existing) existing.qty += 1;
      else state.cart.push({ ...item, qty: 1 });
      toast(`Added ${item.name} to cart!`, 'bg-green-600');
      updateCartBadge();
    }

    function updateQty(id, delta) {
      const idx = state.cart.findIndex(c => c.id === id);
      if (idx !== -1) {
        state.cart[idx].qty += delta;
        if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
      }
      renderPage('cart');
    }

    function toggleFavorite(id) {
      const idx = state.favorites.indexOf(id);
      if (idx > -1) state.favorites.splice(idx, 1);
      else state.favorites.push(id);
      renderPage(document.getElementById('menu-grid') ? 'home' : 'favorites');
    }

    function updateCartBadge() {
      const badge = document.getElementById('cart-badge');
      const count = state.cart.reduce((sum, item) => sum + item.qty, 0);
      if (count > 0) { badge.innerText = count; badge.classList.remove('hidden'); }
      else badge.classList.add('hidden');
    }

    function checkout() {
      if (!state.user) {
        toast('Please login to place an order!', 'bg-red-500');
        navigateTo('login');
        return;
      }

      if (state.cart.length === 0) {
        toast('Your cart is empty', 'bg-red-500');
        return;
      }

      const loc = document.getElementById('delivery-location').value;
      const subtotal = state.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const discount = state.appliedPromo ? Math.round(subtotal * 0.10) : 0;
      const deliveryFee = 1500;

      const newOrder = {
        id: 'QB-' + Math.floor(1000 + Math.random() * 9000),
        date: new Date().toISOString().replace('T', ' ').substring(0, 16),
        customerName: state.user.name,
        items: [...state.cart],
        subtotal,
        discount,
        deliveryFee,
        total: subtotal - discount + deliveryFee,
        status: 'Processing',
        paymentStatus: 'Remaining',
        customerConfirmed: false,
        location: loc
      };

      state.orders.unshift(newOrder);
      saveStateToLocalStorage();
      state.cart = [];
      state.appliedPromo = null;
      toast('Order Placed Successfully!', 'bg-green-600');
      navigateTo('delivery');
    }

    function handleLogin(e) {
      e.preventDefault();
      const contact = document.getElementById('login-contact').value.trim();
      const password = document.getElementById('login-password').value;

      if ((contact.toLowerCase() === 'admin' || contact === '+255673644983') && password === 'Sa22126453@') {
        state.user = { name: 'Admin', contact, isAdmin: true };
        toast('Welcome back, Admin!', 'bg-purple-600');
        navigateTo('admin');
        return;
      }

      const foundUser = state.registeredUsers.find(u => u.contact === contact && u.password === password);
      if (foundUser) {
        state.user = foundUser;
        toast(`Welcome back, ${foundUser.name}!`, 'bg-brand-600');
        navigateTo('home');
        return;
      }

      state.tempUser = { name: contact.includes('@') ? contact.split('@')[0] : 'Customer', contact, isAdmin: false };
      toast('OTP verification code sent!', 'bg-blue-600');
      navigateTo('verify-phone', { contact });
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const contact = document.getElementById('reg-contact').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-password-confirm').value;

      if (password !== confirmPassword) {
        toast('Passwords do not match!', 'bg-red-500');
        return;
      }

      state.tempUser = { name, contact, password, isAdmin: false };
      toast('Registration OTP sent to your contact!', 'bg-blue-600');
      navigateTo('verify-phone', { contact });
    }

    function confirmOTP(e) {
      e.preventDefault();
      const otp1 = document.getElementById('otp-1').value;
      const otp2 = document.getElementById('otp-2').value;
      const otp3 = document.getElementById('otp-3').value;
      const otp4 = document.getElementById('otp-4').value;
      const enteredOtp = '' + otp1 + otp2 + otp3 + otp4;

      if (enteredOtp === '4829' || state.tempUser) {
        state.user = { ...state.tempUser, verified: true };
        state.registeredUsers.push(state.user);
        saveStateToLocalStorage();
        delete state.tempUser;
        toast(`Welcome ${state.user.name}! Account verified.`, 'bg-brand-600');
        navigateTo('home');
      } else {
        toast('Invalid OTP code! Try demo code: 4829', 'bg-red-500');
      }
    }

    function updateUserNav() {
      const container = document.getElementById('user-nav-container');
      const adminNavBtn = document.getElementById('admin-nav-btn');
      if (state.user && state.user.isAdmin) adminNavBtn.classList.remove('hidden');
      else adminNavBtn.classList.add('hidden');

      if (state.user) {
        container.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-brand-600 hidden sm:inline">${state.user.name}</span>
            <button onclick="logout()" class="p-2 text-xs bg-slate-100 dark:bg-slate-700 text-red-500 rounded-lg hover:bg-red-50 transition"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
          </div>
        `;
      } else {
        container.innerHTML = `<button onclick="navigateTo('login')" class="bg-brand-600 hover:bg-brand-700 text-white text-xs sm:text-sm font-semibold px-3 py-2 rounded-lg">Login</button>`;
      }
    }

    function logout() {
      state.user = null;
      toast('Logged out successfully', 'bg-slate-700');
      navigateTo('home');
    }

    function toggleLanguage() {
      state.lang = state.lang === 'en' ? 'sw' : 'en';
      document.getElementById('lang-btn-text').innerText = state.lang === 'en' ? 'SW' : 'EN';
      renderPage(document.getElementById('menu-grid') ? 'home' : 'cart');
    }

    function toggleDarkMode(force) {
      state.darkMode = force !== undefined ? force : !state.darkMode;
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (state.darkMode) {
        html.classList.add('dark');
        icon.className = 'fa-solid fa-sun';
      } else {
        html.classList.remove('dark');
        icon.className = 'fa-solid fa-moon';
      }
      localStorage.setItem('qb_dark', state.darkMode);
    }

    function toast(message, bgColor = 'bg-brand-600') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `${bgColor} text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 pointer-events-auto toast-enter`;
      toast.innerHTML = `<i class="fa-solid fa-bell"></i> <span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('toast-show'), 10);
      setTimeout(() => {
        toast.classList.remove('toast-show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
